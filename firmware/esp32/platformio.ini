; AI Toy Lab — ESP32 toy controller firmware (Arduino framework via PlatformIO)
;
;   Build:   pio run -e esp32dev
;   Flash:   pio run -e esp32dev -t upload          (add --upload-port /dev/cu.usbserial-XXXX if needed)
;   Monitor: pio device monitor -b 115200
;
; Pick the env matching your board. Pins are build flags, so they can be changed here
; without touching code (see include/config.h for every option).

[platformio]
default_envs = esp32dev

[env]
platform = espressif32@^6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
; two OTA app slots (future OTA) with room for Wi-Fi + BLE in one image
board_build.partitions = min_spiffs.csv
lib_deps =
  links2004/WebSockets@^2.4.1
  bblanchon/ArduinoJson@^7.0.4
  h2zero/NimBLE-Arduino@^1.4.3
build_flags =
  -DFIRMWARE_VERSION=\"0.1.0\"
  -DCORE_DEBUG_LEVEL=1

; Classic ESP32 DevKit (ESP32-WROOM-32). Most "DOIT ESP32 DEVKIT V1" boards have a blue LED on GPIO2.
[env:esp32dev]
board = esp32dev
build_flags = ${env.build_flags}
  -DLED_PIN=2
  -DBUTTON_PIN=0

; ESP32-S3-DevKitC-1: onboard LED is an addressable RGB (GPIO48) which this simple driver
; does not drive — wire a plain LED + 220Ω resistor to a free GPIO and set LED_PIN.
[env:esp32-s3]
board = esp32-s3-devkitc-1
build_flags = ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1   ; serial log over the native USB port (cu.usbmodem*)
  -DLED_PIN=-1
  -DBUTTON_PIN=0

; ESP32-C3-DevKitM-1: BOOT button is GPIO9. Onboard LED is addressable RGB (GPIO8) → external LED recommended.
[env:esp32-c3]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags}
  -DLED_PIN=-1
  -DBUTTON_PIN=9
