# Pre-made lines, recorded once with the expressive Gemini voice (tools/prebuild_voice_lines.py) and
# replayed from data/voice_cache/. Live replies use the fast voice; when the toy says one of these lines,
# or tells one of these stories, the recorded performance plays instead.
#
# Keys per personality:
#   greeting / not_heard / llm_failure / limit : fixed lines used by the pipeline
#   stories: {id: {title, text}}  - the LLM may choose one with <<story=id>> when the child asks for a story
#
# Chhota Bheem: internal non-commercial demo for the rights holders; licence required before distribution.
# The stories below are ORIGINAL short tales in Bheem's world (no show scripts reproduced).

bheem_hi:
  greeting: "नमस्ते दोस्त! मैं छोटा भीम हूँ, ढोलकपुर से आया हूँ। चलो, आज मिलकर खूब मस्ती करते हैं!"
  not_heard: "अरे दोस्त, मैंने ठीक से नहीं सुना। एक बार फिर से बोलो ना!"
  llm_failure: "ओह, मेरा दिमाग़ थोड़ा घूम गया! क्या तुम फिर से बोलोगे?"
  limit: "आज के लिए हमारा खेल का समय ख़त्म हो गया दोस्त। कल फिर मिलते हैं!"
  stories:
    jaggu_mango:
      title: "जग्गू और मीठा आम"
      text: >-
        एक दिन जग्गू बंदर को पेड़ की सबसे ऊँची डाल पर एक बड़ा सा पीला आम दिखा। वो उछला, कूदा, पर आम तक नहीं पहुँच पाया।
        तब राजू ने कहा, चलो सब मिलकर कोशिश करते हैं! मैंने राजू को कंधे पर उठाया, और राजू ने जग्गू को ऊपर चढ़ने में मदद की।
        जग्गू ने आम तोड़ लिया, और फिर हम सबने मिलकर आम बाँटकर खाया। मिलकर काम करो, तो हर काम आसान हो जाता है!
    chutki_laddoo:
      title: "चुटकी के खोए लड्डू"
      text: >-
        एक सुबह चुटकी ने ढेर सारे लड्डू बनाए, पर जब वो वापस आई तो थाली खाली थी! सब हैरान हो गए।
        हमने ज़मीन पर छोटे छोटे पंजों के निशान देखे और उनके पीछे पीछे चल पड़े।
        निशान एक पेड़ के पास ख़त्म हुए, जहाँ गिलहरी के छोटे छोटे बच्चे भूखे बैठे थे! चुटकी मुस्कुराई और बोली, कोई बात नहीं, मैं और लड्डू बना दूँगी।
        बाँटने से ख़ुशी दोगुनी हो जाती है, है ना दोस्त?
    rain_picnic:
      title: "बारिश वाली पिकनिक"
      text: >-
        एक दिन हम सब दोस्त पिकनिक पर गए, और अचानक ज़ोर से बारिश होने लगी! कालिया बोला, अब तो सारा मज़ा ख़राब हो गया।
        तभी ढोलू भोलू ने कहा, चलो बारिश में ही खेलते हैं! हमने काग़ज़ की नावें बनाईं और पानी में तैराईं।
        सबसे लंबी नाव जग्गू की चली, और कालिया भी ज़ोर ज़ोर से हँसने लगा। कभी कभी अचानक आई चीज़ें भी मज़ेदार बन जाती हैं!

bheem_te:
  greeting: "నమస్తే మిత్రమా! నేను ఛోటా భీమ్‌ని, ధోలక్‌పూర్ నుంచి వచ్చాను. రా, ఈరోజు మనం కలిసి బోలెడు సరదాగా ఆడుకుందాం!"
  not_heard: "అరే మిత్రమా, నాకు సరిగ్గా వినిపించలేదు. ఇంకోసారి చెప్పవా!"
  llm_failure: "అయ్యో, నా బుర్ర కొంచెం తిరిగింది! మళ్ళీ చెబుతావా?"
  limit: "ఈరోజుకి మన ఆట సమయం అయిపోయింది మిత్రమా. రేపు మళ్ళీ కలుద్దాం!"
  stories:
    jaggu_mango:
      title: "జగ్గూ మరియు తియ్యటి మామిడిపండు"
      text: >-
        ఒకరోజు జగ్గూ కోతికి చెట్టు పై కొమ్మన ఒక పెద్ద పసుపు మామిడిపండు కనిపించింది. అది ఎగిరింది, దూకింది, కానీ పండు అందలేదు.
        అప్పుడు రాజు అన్నాడు, అందరం కలిసి ప్రయత్నిద్దాం! నేను రాజుని భుజాల మీద ఎత్తుకున్నాను, రాజు జగ్గూకి పైకి ఎక్కడానికి సాయం చేశాడు.
        జగ్గూ పండు కోసింది, మేమంతా కలిసి పంచుకుని తిన్నాం. కలిసి పని చేస్తే ఏ పనైనా సులువే!
    chutki_laddoo:
      title: "చుట్కీ లడ్డూలు ఎక్కడ?"
      text: >-
        ఒక ఉదయం చుట్కీ బోలెడు లడ్డూలు చేసింది, కానీ తిరిగి వచ్చేసరికి పళ్ళెం ఖాళీ! అందరం ఆశ్చర్యపోయాం.
        నేల మీద చిన్న చిన్న పాదముద్రలు కనిపించాయి, మేము వాటి వెనకే వెళ్ళాం.
        అవి ఒక చెట్టు దగ్గర ఆగాయి, అక్కడ ఆకలితో ఉన్న ఉడుత పిల్లలు కూర్చున్నాయి! చుట్కీ నవ్వి అంది, పర్లేదు, నేను ఇంకా లడ్డూలు చేస్తాను.
        పంచుకుంటే ఆనందం రెట్టింపు అవుతుంది, కదా మిత్రమా?
    rain_picnic:
      title: "వాన పిక్నిక్"
      text: >-
        ఒకరోజు మేమంతా పిక్నిక్‌కి వెళ్ళాం, అకస్మాత్తుగా పెద్ద వాన మొదలైంది! కాలియా అన్నాడు, ఇక సరదా అంతా పోయింది.
        అప్పుడు ఢోలూ భోలూ అన్నారు, వానలోనే ఆడుకుందాం! మేము కాగితపు పడవలు చేసి నీళ్ళలో వదిలాం.
        జగ్గూ పడవ అన్నిటికంటే దూరం వెళ్ళింది, కాలియా కూడా గట్టిగా నవ్వాడు. ఒక్కోసారి అనుకోకుండా వచ్చేవి కూడా సరదాగా మారతాయి!
